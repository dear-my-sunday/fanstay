<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FanStay 와이어프레임 초안</title>
<style>
  :root {
    --bg: #f3f4f6; --phone: #ffffff; --line: #c9ccd2; --ink: #1f2937; --mute: #6b7280;
    --fill: #e5e7eb; --accent: #3b82f6; --accent-bg: #dbeafe; --ok: #16a34a; --ok-bg: #dcfce7; --warn-bg: #fef3c7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --phone: #1b1e25; --line: #3a3f4a; --ink: #e5e7eb; --mute: #9ca3af;
      --fill: #2a2e38; --accent: #60a5fa; --accent-bg: #1e3a5f; --ok: #4ade80; --ok-bg: #14352299; --warn-bg: #4a3b12; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  header { padding: 24px 16px 8px; max-width: 1200px; margin: 0 auto; }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; color: var(--mute); font-size: 14px; }
  .grid { display: flex; flex-wrap: wrap; gap: 28px; padding: 16px; max-width: 1200px; margin: 0 auto 40px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  figcaption small { display: block; color: var(--mute); font-weight: 400; margin-top: 2px; }
  .phone { width: 300px; height: 600px; background: var(--phone); border: 2px solid var(--line); border-radius: 28px; padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .bar { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 15px; }
  .box { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; font-size: 13px; background: var(--fill); }
  .box.plain { background: transparent; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }
  .img { background: var(--fill); border: 1.5px dashed var(--line); border-radius: 8px; display: grid; place-items: center; color: var(--mute); font-size: 11px; }
  .btn { background: var(--accent); color: #fff; border-radius: 10px; padding: 11px; text-align: center; font-size: 14px; font-weight: 600; margin-top: auto; }
  .btn.ghost { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); margin-top: 0; }
  .chip { display: inline-block; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; margin: 0 4px 4px 0; }
  .chip.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--warn-bg); }
  .mute { color: var(--mute); font-size: 12px; }
  .tabs { margin-top: auto; display: flex; justify-content: space-around; border-top: 1.5px solid var(--line); padding-top: 8px; font-size: 11px; color: var(--mute); }
  .tabs b { color: var(--accent); }
  .step { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); flex: none; margin-top: 1px; }
  .dot.done { background: var(--ok); border-color: var(--ok); }
  .dot.now { border-color: var(--accent); background: var(--accent-bg); }
  .toggle { width: 38px; height: 22px; border-radius: 999px; background: var(--accent); position: relative; flex: none; }
  .toggle::after { content: ""; position: absolute; right: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  .pin { position: absolute; font-size: 11px; background: var(--phone); border: 1.5px solid var(--line); border-radius: 6px; padding: 2px 6px; }
  .mapbox { position: relative; flex: 1; min-height: 230px; }
</style>
</head>
<body>
<header>
  <h1>FanStay 와이어프레임 초안</h1>
  <p>로파이 · MVP 핵심 9개 화면 · 문구와 데이터는 모두 예시입니다. 출처: docs/PRD.md, docs/IA.md</p>
</header>

<main class="grid">

  <!-- 1. 로그인 -->
  <figure>
    <figcaption>1. 로그인 / 시작<small>IA: 진입 → 로그인 · 회원가입 · 보호자 초대 링크로 시작</small></figcaption>
    <div class="phone">
      <div style="text-align:center;margin:36px 0 18px">
        <div class="img" style="width:64px;height:64px;border-radius:16px;margin:0 auto 10px">로고</div>
        <div style="font-weight:700;font-size:18px">FanStay</div>
        <div class="mute" style="margin-top:4px">공연 보고, 안전하게 쉬고, 안심하고 귀가</div>
      </div>
      <div class="box plain mute">이메일</div>
      <div class="box plain mute">비밀번호</div>
      <div class="btn" style="margin-top:0">로그인</div>
      <div class="row" style="justify-content:center"><span class="mute">회원가입</span><span class="mute">·</span><span class="mute">비밀번호 찾기</span></div>
      <div class="row"><div class="box grow" style="text-align:center">카카오</div><div class="box grow" style="text-align:center">네이버</div><div class="box grow" style="text-align:center">Apple</div></div>
      <div class="box plain" style="margin-top:auto;text-align:center">보호자 초대 링크를 받으셨나요?<div class="mute">초대 코드로 시작하기</div></div>
    </div>
  </figure>

  <!-- 2. 홈 -->
  <figure>
    <figcaption>2. 홈 (내 예약 대시보드)<small>IA: 홈 · 공연/역할 전환 · 예약 내역 · 메뉴는 인증 없이 열람 가능</small></figcaption>
    <div class="phone">
      <div class="bar"><span>FanStay</span><span class="mute">마이</span></div>
      <div>
        <span class="chip on">OOO 콘서트 ▾</span><span class="chip">△△ 페스티벌</span><span class="chip">👪 지수 보호자</span>
      </div>
      <div class="box plain">
        <div class="row"><b class="grow">OOO 콘서트</b><span class="tag">티켓 미인증</span></div>
        <div class="mute" style="margin:3px 0 8px">11.28 (토) 18:00 · 고척스카이돔 · D-22</div>
        <div class="btn ghost" style="padding:7px;font-size:13px">티켓 인증하기</div>
      </div>
      <div class="mute">내 예약 · 신청</div>
      <div class="box row"><div class="grow"><b>숙소</b><div class="mute">호텔 A · 11.28 체크인</div></div><span class="tag" style="background:var(--ok-bg)">예약 확정</span></div>
      <div class="box row"><div class="grow"><b>귀가·안전</b><div class="mute">승합차 22:30 · 보호자 2명 연결</div></div><span class="tag" style="background:var(--ok-bg)">신청 완료</span></div>
      <div class="box plain row"><div class="grow"><b>동행</b><div class="mute">아직 없어요 · 동행 찾아보기 ›</div></div></div>
      <div class="mute">숙소·귀가·동행은 인증 없이 둘러볼 수 있고, 예약·신청·채팅 요청 때 티켓 인증이 필요해요.</div>
      <div class="tabs"><b>홈</b><span>숙소</span><span>지도</span><span>동행</span><span>마이</span></div>
    </div>
  </figure>

  <!-- 3. 숙소 메인 -->
  <figure>
    <figcaption>3. 숙소 메인<small>IA: 숙소 → 메인(내 예약 · 추천) → 목록 / 비교</small></figcaption>
    <div class="phone">
      <div class="bar"><span>숙소</span><span class="chip on" style="margin:0">OOO 콘서트 ▾</span></div>
      <div class="box row" style="background:var(--ok-bg);border-color:var(--ok)">
        <div class="grow"><b>내 예약 · 호텔 A</b><div class="mute">11.28 체크인 · 1박 · 2명</div></div><span class="mute">상세 ›</span>
      </div>
      <div class="box plain">
        <div class="mute">고척스카이돔 주변 숙소 찾기</div>
        <div class="row" style="margin-top:6px"><span class="chip" style="margin:0">11.28 ~ 11.29</span><span class="chip" style="margin:0">2명</span></div>
      </div>
      <div><span class="chip on">공연장 도보권</span><span class="chip">심야 귀가 가능</span><span class="chip">안전 귀가 보증</span></div>
      <div class="mute">추천 제휴 숙소</div>
      <div class="box plain row"><div class="img" style="width:54px;height:44px;flex:none">사진</div><div class="grow"><b>호텔 A</b><div class="mute">도보 8분 · 89,000원</div></div></div>
      <div class="box plain row"><div class="img" style="width:54px;height:44px;flex:none">사진</div><div class="grow"><b>호텔 B</b><div class="mute">차량 15분 · 72,000원</div></div></div>
      <div class="btn ghost" style="margin-top:0">숙소 모두 보기</div>
      <div class="tabs"><span>홈</span><b>숙소</b><span>지도</span><span>동행</span><span>마이</span></div>
    </div>
  </figure>

  <!-- 2. 숙소 목록 -->
  <figure>
    <figcaption>4. 공연장별 제휴 숙소<small>IA: 숙소 → 목록 / 비교 (3~4곳)</small></figcaption>
    <div class="phone">
      <div class="bar"><span>‹ 고척스카이돔 숙소</span></div>
      <div><span class="chip on">거리순</span><span class="chip">가격순</span><span class="chip">심야 이동 편의</span></div>
      <div class="box plain">
        <div class="img" style="height:70px">숙소 사진</div>
        <div class="row" style="margin-top:8px"><b class="grow">호텔 A</b><span>89,000원</span></div>
        <div class="mute">공연장 도보 8분 · 지하철 1호선 · 승합차 귀가 가능</div>
      </div>
      <div class="box plain">
        <div class="img" style="height:70px">숙소 사진</div>
        <div class="row" style="margin-top:8px"><b class="grow">호텔 B</b><span>72,000원</span></div>
        <div class="mute">공연장 차량 15분 · 승합차 귀가 가능</div>
      </div>
      <div class="box plain row"><b class="grow">호텔 C</b><span class="mute">+ 2곳 더보기</span></div>
      <div class="mute">예약할 때 티켓 인증이 필요해요 (둘러보기는 자유)</div>
      <div class="btn ghost">숙소 비교하기</div>
    </div>
  </figure>

  <!-- 3. 귀가 수단 + 보호자 초대 -->
  <figure>
    <figcaption>5. 귀가 수단 · 보호자 초대<small>IA: 귀가/안전 → 귀가 수단 선택 → 보호자 초대</small></figcaption>
    <div class="phone">
      <div class="bar"><span>‹ 안전 귀가</span></div>
      <div class="mute">귀가 수단</div>
      <div class="box" style="border-color:var(--accent);background:var(--accent-bg)">승합차 셔틀 (6~8명)<div class="mute">숙소 앞 하차 · 22:30 출발</div></div>
      <div class="box plain">동승 안내 셔틀<div class="mute">안내 인력 1명 동승</div></div>
      <div class="mute" style="margin-top:6px">보호자 / 친구 (선택)</div>
      <div class="box plain row"><span class="grow mute">연락처 입력 또는 링크 공유</span><span class="chip on" style="margin:0">초대</span></div>
      <div class="box plain">
        <div class="row"><span class="grow">귀가 중 위치 공유 허용</span><span class="toggle"></span></div>
        <div class="mute" style="margin-top:4px">보호자가 수락해야 연결돼요. 언제든 끌 수 있어요.</div>
      </div>
      <div class="mute">+ 안전 귀가 보증 옵션 5,000원 (예시)</div>
      <div class="btn">귀가 신청</div>
    </div>
  </figure>

  <!-- 4. 팬 실시간 상태 -->
  <figure>
    <figcaption>6. 귀가 실시간 상태 (팬)<small>IA: 귀가/안전 → 실시간 상태 알림 · 위치 공유 토글</small></figcaption>
    <div class="phone">
      <div class="bar"><span>귀가 진행 중</span><span class="tag">보호자 2명 연결</span></div>
      <div class="box plain" style="padding:14px">
        <div class="step"><span class="dot done"></span><div>셔틀 탑승<div class="mute">22:34 · QR 확인</div></div></div>
        <div style="height:18px;border-left:2px solid var(--line);margin-left:7px"></div>
        <div class="step"><span class="dot now"></span><div><b>이동 중</b><div class="mute">호텔 A까지 약 12분</div></div></div>
        <div style="height:18px;border-left:2px solid var(--line);margin-left:7px"></div>
        <div class="step"><span class="dot"></span><div>숙소 도착</div></div>
        <div style="height:18px;border-left:2px solid var(--line);margin-left:7px"></div>
        <div class="step"><span class="dot"></span><div>입실 완료<div class="mute">완료되면 위치 공유 자동 종료</div></div></div>
      </div>
      <div class="box plain row"><span class="grow">위치 공유</span><span class="toggle"></span></div>
      <div class="btn ghost" style="margin-top:auto">도움 요청</div>
    </div>
  </figure>

  <!-- 5. 보호자 화면 -->
  <figure>
    <figcaption>7. 홈 · 보호자로 전환했을 때<small>홈에서 “👪 지수 보호자” 선택 시 보이는 화면 · IA: 보호자 화면 → 도착 알림 · 위치 확인</small></figcaption>
    <div class="phone">
      <div class="bar"><span>FanStay</span><span class="mute">마이</span></div>
      <div><span class="chip">OOO 콘서트</span><span class="chip">△△ 페스티벌</span><span class="chip on">👪 지수 보호자 ▾</span></div>
      <div class="box plain">
        <div class="mute">연결된 팬</div>
        <div style="font-weight:600;margin-top:2px">지수 (예시)</div>
      </div>
      <div class="box" style="background:var(--ok-bg);border-color:var(--ok)">
        <b>셔틀에 탑승했어요</b><div class="mute">22:34 · 호텔 A로 이동 중</div>
      </div>
      <div class="mapbox box plain">
        <div class="img" style="position:absolute;inset:8px">지도 (팬이 공유를 켠 경우만 표시)</div>
        <span class="pin" style="left:40%;top:45%">● 현재 위치</span>
        <span class="pin" style="right:12%;top:18%">호텔 A</span>
      </div>
      <div class="mute">입실 완료 알림이 오면 위치 공유가 자동으로 종료돼요.</div>
      <div class="btn ghost" style="margin-top:0">알림 설정</div>
    </div>
  </figure>

  <!-- 6. 공연장 지도 -->
  <figure>
    <figcaption>8. 공연장 상세 지도<small>IA: 지도 → 공연장 상세 지도 · 편의시설/보관소</small></figcaption>
    <div class="phone">
      <div class="bar"><span>‹ 고척스카이돔</span></div>
      <div><span class="chip on">전체</span><span class="chip">화장실</span><span class="chip">식음료</span><span class="chip">짐 보관</span></div>
      <div class="mapbox box plain">
        <div class="img" style="position:absolute;inset:8px">공연장 내부 / 주변 지도</div>
        <span class="pin" style="left:12%;top:25%">화장실</span>
        <span class="pin" style="right:10%;top:40%">식음료</span>
        <span class="pin" style="left:30%;bottom:18%">간이 보관소</span>
      </div>
      <div class="box plain">
        <b>간이 보관소 (예시)</b>
        <div class="mute">북문 앞 · 운영 17:00~23:00 · 캐리어 가능</div>
      </div>
      <div class="tabs"><span>홈</span><span>숙소</span><b>지도</b><span>동행</span><span>마이</span></div>
    </div>
  </figure>

  <!-- 7. 동행 매칭 -->
  <figure>
    <figcaption>9. 동행 매칭<small>IA: 동행 → 프로필/선호 → 매칭 방식 → 채팅 · 신고</small></figcaption>
    <div class="phone">
      <div class="bar"><span>동행 찾기</span><span class="tag">티켓 인증됨</span></div>
      <div class="mute">매칭 방식</div>
      <div><span class="chip on">성향 비슷한 사람</span><span class="chip">다른 성향</span><span class="chip">무작위</span></div>
      <div class="box plain">
        <div class="mute">내 정보</div>
        <div style="margin-top:4px"><span class="chip on">20대 초반</span><span class="chip on">떼창 선호</span><span class="chip on">귀가 같이</span></div>
      </div>
      <div class="box plain">
        <div class="row"><div class="img" style="width:36px;height:36px;border-radius:50%">사진</div>
          <div class="grow"><b>하늘 (예시)</b> <span class="tag">본인 인증</span><div class="mute">20대 초반 · 같은 구역 · 숙소 동일</div></div></div>
        <div class="row" style="margin-top:8px"><div class="btn ghost grow" style="padding:7px">채팅 요청</div><span class="mute">신고 · 차단</span></div>
      </div>
      <div class="box plain">
        <div class="row"><div class="img" style="width:36px;height:36px;border-radius:50%">사진</div>
          <div class="grow"><b>민서 (예시)</b> <span class="tag">보호자 동행</span><div class="mute">10대 · 보호자 동행 여부 표시</div></div></div>
      </div>
      <div class="tabs"><span>홈</span><span>숙소</span><span>지도</span><b>동행</b><span>마이</span></div>
    </div>
  </figure>

</main>
</body>
</html>
